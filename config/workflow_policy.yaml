schema_version: 1
policy_id: global-workflow-v1
task_states:
  - DRAFT
  - READY_FOR_CLASSIFICATION
  - CLASSIFIED
  - SPEC_READY
  - PLAN_READY
  - IMPLEMENTING
  - TASK_REVIEW
  - FIX_REQUIRED
  - INTEGRATING
  - SYSTEM_QA
  - VERIFIED
  - RC_READY
  - WAITING_HUMAN
  - BLOCKED
  - CLOSED
  - ABANDONED
transitions:
  DRAFT: [READY_FOR_CLASSIFICATION, ABANDONED]
  READY_FOR_CLASSIFICATION: [CLASSIFIED, DRAFT, ABANDONED]
  CLASSIFIED: [SPEC_READY, WAITING_HUMAN, ABANDONED]
  SPEC_READY: [PLAN_READY, WAITING_HUMAN, ABANDONED]
  PLAN_READY: [IMPLEMENTING, WAITING_HUMAN, ABANDONED]
  IMPLEMENTING: [TASK_REVIEW, BLOCKED, WAITING_HUMAN]
  TASK_REVIEW: [FIX_REQUIRED, INTEGRATING, WAITING_HUMAN]
  FIX_REQUIRED: [IMPLEMENTING, WAITING_HUMAN, ABANDONED]
  INTEGRATING: [SYSTEM_QA, VERIFIED, FIX_REQUIRED, BLOCKED]
  SYSTEM_QA: [VERIFIED, FIX_REQUIRED, WAITING_HUMAN, BLOCKED]
  VERIFIED: [RC_READY, CLOSED, WAITING_HUMAN]
  RC_READY: [CLOSED, WAITING_HUMAN]
  WAITING_HUMAN: [CLASSIFIED, SPEC_READY, PLAN_READY, IMPLEMENTING, TASK_REVIEW, FIX_REQUIRED, INTEGRATING, SYSTEM_QA, VERIFIED, RC_READY, ABANDONED]
  BLOCKED: [IMPLEMENTING, INTEGRATING, SYSTEM_QA, ABANDONED]
  CLOSED: []
  ABANDONED: []
mandatory_rules:
  - no_implementation_without_plan
  - no_self_approval
  - fresh_evidence_before_verified
  - independent_review_before_rc
  - human_authorization_before_production_release
  - append_audit_event_for_every_transition
